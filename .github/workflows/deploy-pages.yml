name: Deploy site to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Skip quietly until the Cloudflare secrets are set (the site also publishes on Railway from main).
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Cloudflare secrets not set, skipping
        if: env.HAS_CLOUDFLARE != 'true'
        working-directory: .
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to publish on Cloudflare Pages."
      - uses: actions/checkout@v4
        if: env.HAS_CLOUDFLARE == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: env.HAS_CLOUDFLARE == 'true'
      - run: npm run build
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          # Repository variables (Settings → Secrets and variables → Actions → Variables).
          # Leave NEXT_PUBLIC_API_URL empty to publish in demo mode.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      - uses: cloudflare/wrangler-action@v3
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/out --project-name fallow-coffee --branch main
          workingDirectory: .
